<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rowdy Hop — Press Kit</title>
<style>
  :root {
    --bg: #0d0d0d;
    --panel: #161616;
    --gold: #e8a325;
    --text: #eee;
    --muted: #aaa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  header {
    text-align: center;
    padding: 2.5rem 1rem 1.5rem;
    border-bottom: 1px solid #2a2a2a;
  }
  header h1 {
    margin: 0;
    font-size: 2.5rem;
    letter-spacing: 0.08em;
    color: var(--gold);
    text-transform: uppercase;
  }
  header p {
    margin: 0.5rem 0 0;
    color: var(--muted);
  }
  main {
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  .actions {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-block;
    padding: 0.7rem 1.4rem;
    background: var(--gold);
    color: #111;
    font-weight: bold;
    text-decoration: none;
    border-radius: 4px;
    transition: opacity 0.2s ease;
  }
  .btn:hover { opacity: 0.85; }
  .btn.secondary {
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
  }
  .pdf-wrap {
    background: var(--panel);
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    overflow: hidden;
  }
  .pdf-wrap iframe {
    display: block;
    width: 100%;
    height: 85vh;
    border: none;
  }
  .fallback {
    padding: 2rem;
    text-align: center;
    color: var(--muted);
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 2rem 1rem;
  }
  footer a { color: var(--gold); }
</style>
</head>
<body>

<header>
  <h1>Rowdy Hop</h1>
  <p>Press Kit / One-Sheet</p>
</header>

<main>
  <div class="actions">
    <a class="btn" href="Rowdy%20Hop_One%20Sheet.pdf" download>Download PDF</a>
    <a class="btn secondary" href="Rowdy%20Hop_One%20Sheet.pdf" target="_blank" rel="noopener">Open in New Tab</a>
  </div>

  <div class="pdf-wrap">
    <iframe src="Rowdy%20Hop_One%20Sheet.pdf" title="Rowdy Hop One Sheet">
      <p class="fallback">
        Your browser can't display the PDF inline.
        <a href="Rowdy%20Hop_One%20Sheet.pdf">Click here to download it</a>.
      </p>
    </iframe>
  </div>
</main>

<footer>
  <a href="https://www.rowdyhop.com" target="_blank" rel="noopener">rowdyhop.com</a>
</footer>

</body>
</html>
